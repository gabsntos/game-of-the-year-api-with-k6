name: CI Gaming

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build k6 with xk6-faker (or fallback)
      run: |
        set -e
        export PATH="$PATH:$(go env GOPATH)/bin"
        go install go.k6.io/xk6/cmd/xk6@latest

        # Try a list of possible xk6-faker module paths; pick the first that builds
        CANDIDATES=(
          "github.com/grafana/xk6-faker"
          "github.com/mostafa/xk6-faker"
          "github.com/jamesruan/xk6-faker"
        )
        BUILT=0
        for pkg in "${CANDIDATES[@]}"; do
          echo "Attempting xk6 build with $pkg"
          if xk6 build --with "$pkg@latest"; then
            echo "Built k6 with $pkg"
            BUILT=1
            break
          fi
        done

        if [ "$BUILT" -eq 1 ]; then
          sudo mv k6 /usr/local/bin/k6
        else
          echo "xk6 build failed for all candidates, falling back to official k6 binary"
          K6_VERSION=0.48.0
          curl -fL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf k6.tar.gz
          sudo mv k6-v${K6_VERSION}-linux-amd64/k6 /usr/local/bin/
        fi
        sudo chmod +x /usr/local/bin/k6
        k6 version

    - name: Start the API server
      run: npm start

    - name: Run performance tests
      run: npm run k6