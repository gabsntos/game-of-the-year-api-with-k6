name: CI Gaming

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Install k6
      run: |
        set -e
        K6_VERSION=0.48.0
        curl -fL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
        tar -xzf k6.tar.gz
        sudo mv k6-v${K6_VERSION}-linux-amd64/k6 /usr/local/bin/
        sudo chmod +x /usr/local/bin/k6
        k6 version

    - name: Run performance tests
      run: npm run k6